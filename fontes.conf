[ibge_localidades]
url    = https://servicodados.ibge.gov.br/api/v1/localidades/municipios
dataset = -
ttl     = 2592000

# População residente estimada (SIDRA, tabela 6579, variável 9324).
#
# Duas entradas porque a descoberta dos anos é mais barata no nível de UF:
# [ibge_sidra_ufs] traz as 27 UFs x todos os períodos numa requisição de
# 162 KB, e é de lá que sai a lista de anos — que tem lacunas conhecidas
# (2007, 2022 e 2023 não existem na série).
#
# A url de [ibge_sidra_municipios] é um prefixo: o ano, ou a lista de anos
# separados por vírgula, é acrescentado no fim. A API não aceita os 22
# períodos de uma vez (responde 400), e a ingestão pede de três em três.
[ibge_sidra_ufs]
url    = https://apisidra.ibge.gov.br/values/t/6579/n3/all/v/9324/p/all
dataset = -
ttl     = 2592000

[ibge_sidra_municipios]
url    = https://apisidra.ibge.gov.br/values/t/6579/n6/all/v/9324/p
dataset = -
ttl     = 2592000

